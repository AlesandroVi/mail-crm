<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail CRM: iniciar sesión</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#2f5d50">
<style>
  :root { --fondo: #f6f5f1; --panel: #ffffff; --texto: #1d1c1a; --suave: #6b6861; --borde: #e2dfd7;
          --acento: #2f5d50; --acento-texto: #ffffff; --error: #b3402f; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #171716; --panel: #201f1d; --texto: #ecebe6; --suave: #a09c93; --borde: #34322e;
            --acento: #7fc4ad; --acento-texto: #10201b; --error: #f08a78; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--fondo); color: var(--texto); font: 16px/1.45 system-ui, "Segoe UI", sans-serif; }
  form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--borde);
         border-radius: 12px; padding: 24px; }
  img { width: 48px; height: 48px; border-radius: 12px; display: block; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--suave); font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 4px; }
  input { width: 100%; font: inherit; color: inherit; background: var(--fondo); border: 1px solid var(--borde);
          border-radius: 8px; padding: 10px 12px; }
  button { width: 100%; margin-top: 14px; font: inherit; font-weight: 600; padding: 10px; border-radius: 8px;
           border: 0; background: var(--acento); color: var(--acento-texto); cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #error { color: var(--error); font-size: 14px; margin-top: 12px; min-height: 20px; }
</style>
</head>
<body>
<form id="form">
  <img src="/icon-192.png" alt="">
  <h1>Mail CRM</h1>
  <p>Ingresá tu contraseña para ver el panel.</p>
  <label for="clave">Contraseña</label>
  <input id="clave" name="clave" type="password" autocomplete="current-password" required autofocus>
  <button id="entrar">Entrar</button>
  <div id="error" role="alert"></div>
</form>
<script>
document.getElementById("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const boton = document.getElementById("entrar"), error = document.getElementById("error");
  boton.disabled = true; error.textContent = "";
  try {
    const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ clave: document.getElementById("clave").value }) });
    if (r.ok) { location.href = "/"; return; }
    const datos = await r.json().catch(() => ({}));
    error.textContent = typeof datos.detail === "string" ? datos.detail : "No se pudo iniciar sesión.";
  } catch { error.textContent = "No se pudo conectar con el servidor."; }
  boton.disabled = false;
});
</script>
</body>
</html>
